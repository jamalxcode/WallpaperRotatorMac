name: Release
# Push a tag like v1.2.0 to build a universal WallpaperRotator.app and attach
# it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build universal app
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/WallpaperRotator-*.zip \
            --title "Wallpaper Rotator ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Download **WallpaperRotator-${GITHUB_REF_NAME#v}.zip**, unzip it and drag **WallpaperRotator.app** to Applications.

          The app is not notarized by Apple, so the first time you open it macOS will block it: go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. Requires macOS 13 or later (Apple silicon or Intel)."
